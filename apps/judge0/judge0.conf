# Redis
REDIS_HOST=redis
REDIS_PORT=6379
REDIS_PASSWORD=anothersecret
REDIS_URL=redis://default:anothersecret@redis:6379/0

# Postgres
POSTGRES_HOST=db
POSTGRES_PORT=5432
POSTGRES_USER=judge0
POSTGRES_PASSWORD=supersecret
POSTGRES_DB=judge0
DATABASE_URL=postgresql://judge0:supersecret@db:5432/judge0

# Cgroups - MUST be false on Windows Docker Desktop
ENABLE_CGROUPS=false

# Output settings
ENABLE_COMPILE_OUTPUT=true
MAX_COMPILE_OUTPUT_SIZE=65536
ENABLE_STDERR=true
MAX_STDERR_SIZE=65536
ENABLE_MESSAGE=true

# Limits
CPU_TIME_LIMIT=5
MAX_CPU_TIME_LIMIT=15
CPU_EXTRA_TIME=1
MAX_CPU_EXTRA_TIME=3
WALL_TIME_LIMIT=10
MAX_WALL_TIME_LIMIT=20
MEMORY_LIMIT=128000
MAX_MEMORY_LIMIT=256000
STACK_LIMIT=64000
MAX_STACK_LIMIT=128000
MAX_PROCESSES_AND_OR_THREADS=60
MAX_MAX_PROCESSES_AND_OR_THREADS=120