# Judge0 Optimized Configuration for High Performance
# 4 Worker Instances + Load Balancing

# Telemetry and Monitoring
JUDGE0_TELEMETRY_ENABLE=false
RESTART_MAX_TRIES=3
MAINTENANCE_MODE=false
MAINTENANCE_MESSAGE=Judge0 is under maintenance

# Performance Settings
ENABLE_WAIT_RESULT=true
ENABLE_COMPILER_OPTIONS=true
ALLOWED_LANGUAGES_FOR_COMPILER_OPTIONS=cpp,c,java,python3,go,rust,php,ruby,javascript,typescript
ENABLE_COMMAND_LINE_ARGUMENTS=true
ENABLE_SUBMISSION_DELETE=true
ENABLE_BATCHED_SUBMISSIONS=true
MAX_SUBMISSION_BATCH_SIZE=20
ENABLE_CALLBACKS=true
CALLBACKS_MAX_TRIES=3
CALLBACKS_TIMEOUT=5
ENABLE_ADDITIONAL_FILES=true
SUBMISSION_CACHE_DURATION=3600
USE_DOCS_AS_HOMEPAGE=false

INTERVAL=0.05
COUNT=4
MAX_QUEUE_SIZE=1000

# Security
ALLOW_ORIGIN=*
DISALLOW_ORIGIN=
ALLOW_IP=
DISALLOW_IP=
AUTHN_HEADER=
AUTHN_TOKEN=
AUTHZ_HEADER=
AUTHZ_TOKEN=

# Resource Limits (optimized for 30GB RAM server)
CPU_TIME_LIMIT=5
MAX_CPU_TIME_LIMIT=15
CPU_EXTRA_TIME=1
MAX_CPU_EXTRA_TIME=5
WALL_TIME_LIMIT=10
MAX_WALL_TIME_LIMIT=30
MEMORY_LIMIT=128000
MAX_MEMORY_LIMIT=512000

STACK_LIMIT=64000
MAX_STACK_LIMIT=128000

MAX_PROCESSES_AND_OR_THREADS=0
MAX_MAX_PROCESSES_AND_OR_THREADS=0
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
ALLOW_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false
ALLOW_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false

MAX_FILE_SIZE=1024
MAX_MAX_FILE_SIZE=2048

NUMBER_OF_RUNS=1
MAX_NUMBER_OF_RUNS=1

REDIRECT_STDERR_TO_STDOUT=false
MAX_EXTRACT_SIZE=10240

ALLOW_ENABLE_NETWORK=false
ENABLE_NETWORK=false

# Rails Configuration (optimized for high load)
RAILS_ENV=production
RAILS_MAX_THREADS=10
RAILS_SERVER_PROCESSES=2
SECRET_KEY_BASE=your-secret-key-base-here

# Database Configuration
POSTGRES_HOST=db
POSTGRES_PORT=5432
POSTGRES_USER=judge0
POSTGRES_PASSWORD=supersecret
POSTGRES_DB=judge0
DATABASE_URL=postgresql://judge0:supersecret@db:5432/judge0

# Redis Configuration
REDIS_HOST=redis
REDIS_PORT=6379
REDIS_PASSWORD=anothersecret
REDIS_URL=redis://default:anothersecret@redis:6379/0
