version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: compiler-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 8gb --maxmemory-policy noeviction --tcp-keepalive 60 --timeout 300
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    environment:
      - REDIS_PASSWORD=your_secure_password_here
    networks:
      - compiler-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: compiler-redis-commander
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    networks:
      - compiler-network
    depends_on:
      - redis

volumes:
  redis_data:
    driver: local

networks:
  compiler-network:
    driver: bridge
