storage:
  wiredTiger:
    engineConfig:
      cacheSizeGB: 20   # increase for high concurrency
    collectionConfig:
      blockCompressor: snappy
    indexConfig:
      prefixCompression: true

net:
  port: 27017
  maxIncomingConnections: 1500 

operationProfiling:
  slowOpThresholdMs: 200
  mode: slowOp

systemLog:
  verbosity: 1
